<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Calculator</title>
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card p-3 shadow">

        <input type="text"
            class="form-control text-end fs-3 mb-3 bg-dark text-white"
            style="width: 320px;"
            id="display"
            readonly>

        <div class="container-fluid p-0">

            <div class="row g-2 mb-2">
                <div class="col">
                    <button data-value="C" class="btn btn-warning w-100">C</button>
                </div>

                <div class="col">
                    <button data-value="/" class="btn btn-warning w-100">÷</button>
                </div>

                <div class="col">
                    <button data-value="*" class="btn btn-warning w-100">×</button>
                </div>

                <div class="col">
                    <button data-value="|" class="btn btn-warning w-100">←</button>
                </div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col">
                    <button data-value="7" class="btn btn-secondary w-100">7</button>
                </div>
                <div class="col">
                    <button data-value="8" class="btn btn-secondary w-100">8</button>
                </div>
                <div class="col">
                    <button data-value="9" class="btn btn-secondary w-100">9</button>
                </div>
                <div class="col">
                    <button data-value="-" class="btn btn-warning w-100">-</button>
                </div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col">
                    <button data-value="4" class="btn btn-secondary w-100">4</button>
                </div>
                <div class="col">
                    <button data-value="5" class="btn btn-secondary w-100">5</button>
                </div>
                <div class="col">
                    <button data-value="6" class="btn btn-secondary w-100">6</button>
                </div>
                <div class="col">
                    <button data-value="+" class="btn btn-warning w-100">+</button>
                </div>
            </div>

            <div class="row g-2">

                <div class="col-9">

                    <div class="row g-2 mb-2">
                        <div class="col">
                            <button data-value="1" class="btn btn-secondary w-100">1</button>
                        </div>
                        <div class="col">
                            <button data-value="2" class="btn btn-secondary w-100">2</button>
                        </div>
                        <div class="col">
                            <button data-value="3" class="btn btn-secondary w-100">3</button>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col">
                            <button data-value="0" class="btn btn-secondary w-100">0</button>
                        </div>
                        <div class="col">
                            <button data-value="." class="btn btn-secondary w-100">.</button>
                        </div>
                    </div>

                </div>

                <div class="col-3">
                    <button data-value="="
                        class="btn btn-success w-100"
                        style="height: 83px;">
                        =
                    </button>
                </div>

            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
