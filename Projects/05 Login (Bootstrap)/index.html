<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body class="bg-dark text-light d-flex justify-content-center align-items-center vh-100">

    <div class="position-absolute top-0 end-0">
        <button class="btn btn-outline-light" onclick="toggleMode()" data-bs-toggle="tooltip" title="Change Theme">☀/ 🌙</button>
    </div>

    <div class="card shadow-lg" style="width: 360px;">

        <div class="card-body">
            <h2 class="text-center mb-4">Login</h2>
            <form onsubmit="return validateLogin()">
    
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" type="email" placeholder="Enter Email" class="form-control">
                    <small class="text-danger small" id="emailError"></small>
                </div>
    
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <input id="password" type="password" placeholder="Enter Password" class="form-control">
                        <button class="btn btn-outline-secondary" onclick="togglePassword()" data-bs-toggle="tooltip" title="Show/Hide password">👁</button>
                        <small id="passwordError" class="text-danger small"></small>
                    </div>
    
                </div>
                <button type="submit" class="btn btn-success w-100">Login</button>

                <div class="d-flex justify-content-between mt-3">
                    <a href="forgot.html" class="text-warning small">Forgot Password?</a>
                    <a href="#" onclick="showOTP()" class="text-warning small">Login With OTP</a>
                </div>
            </form>
            <div id="otpbox" class="mt-4 d-none">
                <h3 class="text-center">Enter OTP</h3>
                <input class="form-control mb-2" type="text" placeholder="6-digit OTP" id="otp">
                <button onclick="verifyOTP()" class="btn btn-primary w-100">Verify OTP</button>
            </div>
        </div>
        
    </div>

</body>

</html>
