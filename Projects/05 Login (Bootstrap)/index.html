<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Page</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="script.js" defer></script>
    </head>
    <body class="bg-dark text-light d-flex justify-content-center align-items-center vh-100">
        <button onclick="toggleMode()" class = "btn-lightmode">☀/ 🌙</button>
        <div class="login-container">
            <h2>Lsdsogin</h2>
            <form onsubmit="return validateLogin()">

                <div class="input-group">
                    <label for="">Email</label>
                    <input id="email" type="email" placeholder="Enter Email">
                    <small class ="error" id="emailError"></small>
                </div>

                <div class="input-group">
                    <label for="">Password</label>
                    <div class="password-box">
                        <input id="password" type="password" placeholder="Enter Password">
                        <span onclick="togglePassword()">👁</span>
                        <small id = "passwordError" class="error"></small>
                    </div>
                  
                </div>
                <button type="submit">Login</button>
                <div class="links">
                    <a href="forgot.html">Forgot Password?</a>
                    <a href="#" onclick="showOTP()">Login With OTP</a>
                </div>
            </form>
            <div id ="otpbox"class="OTP-box hidden">
                <h3>Enter OTP</h3>
                <input type="text" placeholder="6-digit OTP" id="otp">
                <button onclick = "verifyOTP()">Verify OTP</button>
            </div>
        </div>
        
    </body>
</html>
