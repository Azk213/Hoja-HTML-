<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="dark d-flex justify-content-center align-items-center vh-100">
    <div class="position-absolute top-0 end-0 m-3">
         <button class="btn btn-outline-secondary" onclick="toggleTheme()">🌙 / 🔆</button>
    </div>
    <div class="main shadow">
        <h2 class="text-center mb-4">My To-Do App</h2>

        <div class="input-group mb-3">
            <input type="text" placeholder="Add New Task" id="taskInput" class="form-control">
            <button onclick="addTask()" class="btn btn-success">Add Task</button>
        </div>

        <ul id="taskList" class="list-group m-3">
        </ul>

        <div class="d-flex justify-content-between align-items-center">
                <span id="taskCount" class="span-count">3 Tasks</span>
                <button class="btn btn-danger btn-sm" onclick="clearCompleted()">Clear Completed</button>
        </div>
    </div>
</body>

</html>
