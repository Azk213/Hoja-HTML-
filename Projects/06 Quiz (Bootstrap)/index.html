<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script.js" defer></script>
    <title>Quiz App</title>
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    <div class ="card shadow-lg text-center p-4" style="width: 360px;" id="startScreen">
        <h2 class="mb-2">Quiz Challenge</h2>
        <p class="text-muted">Test Your knowledge</p>
        <button class="btn btn-primary mt-3" onclick="startQuiz()">Start Quiz</button>
    </div>
    
    <div class="card shadow-lg text-center p-4 d-none" style="width: 360px;" id="quizScreen">
        <div class="d-flex justify-content-between mb-3 small text-secondary">
            <span id = "questionCount">Question 1 / 5</span>
            <span id = "scoreCount">Score : 0</span>
        </div>
        <h2 class="mb-3"id="question">Question 1</h2>

        <div class="mb-3" id="options">
        </div>
        <button class="btn btn-success w-100 " onclick="nextQuestion()">Next</button>
    </div>

    <div class="card shadow-lg text-center p-4 d-none" id="resultScreen">
        <h1 class="mb-2">Quiz Completed 🎉</h1>
        <p class="text-muted">Your Score</p>
        <h2 class="mb-3"id ="finaleScore"></h2>
        <button class="btn btn-primary w-100 " onclick="restartQuiz()">Restart</button>
    </div>
</body>
</html>
