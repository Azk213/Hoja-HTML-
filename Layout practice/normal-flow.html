<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div {
            background-color: lightblue;
            border: 2px solid blue;
            margin: 30px; 
            padding: 30px; 
            
        }
        span {
            background-color: yellow;
            border: 1px solid orange;
        }
    </style>
    <title>Normal flow</title>
</head>
<body>
    <h1>Normal Flow Layout</h1>
    <div>First Box</div>
    <div>Second Box</div>
    <div>Third Box</div>
    <p>This is a paragraph with
        <span>an inline element</span> and another <span>inline element</span>
    </p> 
</body>
</html>
